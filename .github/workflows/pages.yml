name: Publish VoiceTrail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir github-pages build
      - name: Verify Tailwind CSS output
        shell: bash
        run: |
          set -euo pipefail
          css_file="$(find github-pages/dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$css_file"
          test -s "$css_file"
          grep -q '@layer theme' "$css_file"
          grep -q '.overlap-character' "$css_file"
          echo "Tailwind Vite CSS verified: $css_file ($(wc -c < "$css_file") bytes)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

